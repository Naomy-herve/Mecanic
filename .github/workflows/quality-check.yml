name: KIA PIECE quality checks

on:
  push:
    branches:
      - kia-piece-dev
  pull_request:
    branches:
      - kia-piece-dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-only-secret-not-used-for-real-sessions-2026
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Reference pages validation
        run: npm run check:references

      - name: Commerce and access security validation
        run: npm run check:commerce

      - name: TypeScript validation
        run: npm run typecheck

      - name: Production build
        run: npm run build
